line-length = 99
# Keep preview behavior identical in editors, pre-commit, and the locked environment.
required-version = "==0.17.3"
# Keep compiler output untouched even when a hook or editor passes a file directly.
force-exclude = true
extend-exclude = [
    "hydrogram/errors/exceptions",
    "hydrogram/raw/all.py",
    "hydrogram/raw/base",
    "hydrogram/raw/functions",
    "hydrogram/raw/types",
]

[lint]
select = [
    "FURB", # refurb
    "I",    # isort
    "E",    # pycodestyle: error
    "W",    # pycodestyle: warning
    "UP",   # pyupgrade
    "F",    # pyflakes
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
    "PERF", # perflint
    "N",    # pep8-naming
    "RUF",  # ruff
    "G",    # flake8-logging-format
    "TID",  # flake8-tidy-imports
    "TC",   # flake8-type-checking
    "FA",   # flake8-future-annotations
    "PL",   # pylint
]
ignore = [
    "line-too-long", # E501: the formatter wraps lines on a best-effort basis.
    # These rules conflict with Ruff's formatter (the E and W families select them).
    "indentation-with-invalid-multiple", # E111
    "indentation-with-invalid-multiple-comment", # E114
    "over-indented", # E117
    "tab-indentation", # W191
    "ambiguous-unicode-character-string",
    "ambiguous-unicode-character-docstring",
    "ambiguous-unicode-character-comment",
    "non-empty-init-module", # Allow implementation code in __init__.py files (library design pattern)
    "whitespace-before-punctuation",
    "try-except-in-loop",
    "PLR09",
    "magic-value-comparison",
    "too-many-nested-blocks",
    "unspecified-encoding",
    "redefined-loop-name",
    "global-statement",
    "subclass-builtin", # This rule is unsafe and not relevant for us.
    "noqa-comments", # Preserve the project's existing suppression syntax.
    "too-many-statements-in-try-clause", # Keep the existing complexity policy.
]
# Retain the project's existing preview rules; review changes when upgrading Ruff.
preview = true

[lint.per-file-ignores]
# Decorators support calls on both Client classes and instances.
"hydrogram/methods/decorators/*.py" = ["method-receiver-default"]

[lint.isort]
known-first-party = ["hydrogram"]

[format]
docstring-code-format = true
line-ending = "lf"
# Retain the existing style without reformatting the codebase.
preview = true
