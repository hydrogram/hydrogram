line-length = 99

[lint]
select = [
    "FURB", # refurb
    "I",    # isort
    "E",    # pycodestyle: error
    "W",    # pycodestyle: warning
    "UP",   # pyupgrade
    "F",    # pyflakes
    "SIM",  # flake8-simplify
    "RET",  # flake8-return
    "C4",   # flake8-comprehensions
    "PTH",  # flake8-use-pathlib
    "PERF", # perflint
    "N",    # pep8-naming
    "RUF",  # ruff
    "G",    # flake8-logging-format
    "TID",  # flake8-tidy-imports
    "TC",   # flake8-type-checking
    "FA",   # flake8-future-annotations
    "PL",   # pylint
]
ignore = [
    "ambiguous-unicode-character-string",
    "ambiguous-unicode-character-docstring",
    "ambiguous-unicode-character-comment",
    "non-empty-init-module", # Allow implementation code in __init__.py files (library design pattern)
    "whitespace-before-punctuation",
    "try-except-in-loop",
    "PLR09",
    "magic-value-comparison",
    "too-many-nested-blocks",
    "unspecified-encoding",
    "redefined-loop-name",
    "global-statement",
    "subclass-builtin", # This rule is unsafe and not relevant for us.
    "noqa-comments", # Preserve the project's existing suppression syntax.
    "too-many-statements-in-try-clause", # Keep the existing complexity policy.
]
preview = true

[lint.per-file-ignores]
# Decorators support calls on both Client classes and instances.
"hydrogram/methods/decorators/*.py" = ["method-receiver-default"]

[lint.isort]
known-first-party = ["hydrogram"]

[format]
docstring-code-format = true
preview = true
