name: Bug report
description: Report a reproducible problem with Hydrogram or its documentation
body:
  - type: markdown
    attributes:
      value: |
        For usage questions, use [GitHub Discussions](https://github.com/orgs/hydrogram/discussions).
        Remove API hashes, bot tokens, session strings, phone numbers, and other private data from examples and logs. Do not upload session databases.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues for an existing report of this problem.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Describe the problem and what you were doing when it occurred. For documentation issues, include the affected page or section.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps, configuration, and inputs needed to reproduce the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Explain what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Explain what happened instead.
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal code example
      description: Include a small, self-contained example when applicable. Use placeholders for credentials.
      placeholder: |
        from hydrogram import Client
        ...
      render: python

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include exact versions and the installation source (PyPI or a Git commit). For documentation-only issues, enter "Not applicable".
      placeholder: |
        Hydrogram version or commit:
        Python version and implementation (CPython/PyPy):
        Operating system:
        TgCrypto/uvloop versions, if installed:
        Installation source:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Traceback and logs
      description: Paste the full relevant traceback and logs, with credentials and personal data removed.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include related issues, workarounds, or the last working version. If you tested a newer release or development commit, include its version and the result.
