name: Hydrogram

on: [push, pull_request]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          uv sync --locked --all-extras --dev

      - name: Generate API
        run: |
          uv run --locked make api

      - name: Run tests
        run: |
          uv run --locked pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
          enable-cache: true
          python-version: "3.14"

      - name: Install a fresh checkout with pip
        run: |
          uv venv --seed "$RUNNER_TEMP/hydrogram-source"
          "$RUNNER_TEMP/hydrogram-source/bin/python" -m pip install .
          "$RUNNER_TEMP/hydrogram-source/bin/python" -I -c "from hydrogram import Client, raw, errors; print(Client.APP_VERSION)"

      - name: Install editable development dependencies
        run: |
          make clean-api
          uv sync --locked --dev
          uv run --locked python -c "from hydrogram import Client; print(Client.APP_VERSION)"

      - name: Build and validate distributions
        run: |
          uv run --locked make build
          uv run --locked twine check --strict dist/*

      - name: Import the wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.whl python -c "from hydrogram import Client, raw, errors; print(Client.APP_VERSION)"

      - name: Import the source distribution outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          uv run --isolated --no-project --with "$GITHUB_WORKSPACE"/dist/*.tar.gz python -c "from hydrogram import Client, raw, errors; print(Client.APP_VERSION)"
