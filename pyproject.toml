[project]
name = "Hydrogram"
dynamic = ["version"]
description = "Sleek, advanced, and asynchronous Telegram MTProto API framework in Python, designed for fluid user and bot interactions."
authors = [{ name = "Hydrogram", email = "contact@hydrogram.org" }]
dependencies = ["pyaes==1.6.1", "pysocks==1.7.1", "aiosqlite>=0.19.0"]
readme = "README.md"
license = "LGPL-3.0-or-later"
license-files = ["COPYING", "COPYING.lesser", "NOTICE"]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Internet",
    "Topic :: Communications",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
keywords = ["telegram chat messenger mtproto api client library python"]

[project.urls]
homepage = "https://hydrogram.org"
tracker = "https://github.com/hydrogram/hydrogram/issues"
community = "https://t.me/HydrogramNews"
source = "https://github.com/hydrogram/hydrogram"
documentation = "https://docs.hydrogram.org"
changelog = "https://docs.hydrogram.org/en/latest/releases.html"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
required-version = ">=0.12.24"
# Local builds depend on the version source, hook, and compiler inputs.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hydrogram/__init__.py" },
    { file = "hatch_build.py" },
    { file = "compiler/__init__.py" },
    { file = "compiler/api/*.py" },
    { file = "compiler/api/docs.json" },
    { file = "compiler/api/source/*.tl" },
    { file = "compiler/api/template/*.txt" },
    { file = "compiler/errors/*.py" },
    { file = "compiler/errors/source/*.tsv" },
    { file = "compiler/errors/template/*.txt" },
    { file = "NOTICE" },
]

[dependency-groups]
dev = [
    "ruff>=0.15.7",
    "pytest>=7.4.3",
    "pytest-asyncio>=0.23.2",
    "pytest-cov>=4.1.0",
    "twine>=4.0.2",
    "pre-commit>=4.2.0",
    "httpx[http2]>=0.28.1",
    "lxml>=5.3.2",
]

[project.optional-dependencies]
docs = [
    "sphinx<8.0.0",
    "furo>=2024.8.6",
    "sphinx-autobuild>=2024.10.3",
    "sphinx-copybutton>=0.5.2",
    "pygments>=2.19.1",
    "towncrier>=24.8.0",
    "sphinxcontrib-towncrier>=0.5.0a0",
]
fast = [
    "tgcrypto>=1.2.5",
    "uvloop>=0.19.0; (sys_platform == 'darwin' or sys_platform == 'linux') and platform_python_implementation != 'PyPy'",
]

[tool.hatch.version]
path = "hydrogram/__init__.py"

[tool.hatch.build.targets.sdist]
# Compatible with the packaging/Twine versions in uv.lock.
core-metadata-version = "2.4"
only-include = [
    "hydrogram",
    "compiler",
    "hatch_build.py",
    "Makefile",
    "README.md",
    "COPYING",
    "COPYING.lesser",
    "NOTICE",
]
# Always regenerate these from the compiler inputs when building a wheel.
exclude = [
    "/hydrogram/errors/exceptions",
    "/hydrogram/raw/all.py",
    "/hydrogram/raw/base",
    "/hydrogram/raw/functions",
    "/hydrogram/raw/types",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["hydrogram"]
artifacts = [
    "/hydrogram/errors/exceptions/**",
    "/hydrogram/raw/all.py",
    "/hydrogram/raw/base/**",
    "/hydrogram/raw/functions/**",
    "/hydrogram/raw/types/**",
    "!**/__pycache__/**",
    "!**/*.pyc",
    "!**/*.pyo",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.towncrier]
package = "hydrogram"
filename = "NEWS.rst"
directory = "news/"
template = "news/.template.rst.jinja2"
issue_format = "`#{issue} <https://github.com/hydrogram/hydrogram/issues/{issue}>`_"

[[tool.towncrier.section]]
path = ""

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Improved Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Deprecations and Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Misc"
showcontent = true
